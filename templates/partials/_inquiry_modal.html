<div class="modal fixed inset-0 z-50 items-center justify-center p-4 sm:p-6 [&:not([hidden])]:flex" id="inquiry-modal" hidden>
  <!-- Backdrop (closes modal on click via js-close-modal) -->
  <div class="modal-backdrop fixed inset-0 bg-brand-900/75 backdrop-blur-sm transition-opacity js-close-modal"></div>

  <!-- Modal Box (queried by main.js via .modal-box) -->
  <div class="modal-box relative w-full max-w-2xl max-h-[90vh] overflow-y-auto bg-white rounded-xl shadow-2xl border border-line p-6 sm:p-8 z-10 text-left"
       role="dialog"
       aria-modal="true"
       aria-labelledby="inquiry-modal-title">
    
    <!-- Close Button -->
    <button type="button" 
            class="modal-close js-close-modal absolute top-4 right-4 text-muted hover:text-ink text-2xl font-light leading-none p-2 rounded-md transition-colors" 
            aria-label="Close">
      &times;
    </button>

    <!-- Header Content -->
    <p class="eyebrow mb-1">Bulk Enquiry</p>
    <h3 id="inquiry-modal-title" class="text-2xl sm:text-3xl font-extrabold text-ink tracking-tight mb-2">
      Request a Quotation
    </h3>
    <p class="text-muted text-xs sm:text-sm leading-relaxed mb-6">
      Tell us what you need and our team will get back to you with pricing and supply options.
    </p>

    <!-- Inquiry Form Partial -->
    {% include "partials/_inquiry_form.html" with type="bulk" %}
  </div>
</div>
